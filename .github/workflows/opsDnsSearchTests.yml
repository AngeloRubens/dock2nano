name: ops 1803 rebase tests

on:
  push:
    branches: ['check/ops-1803-rebase']

jobs:
  ops:
    name: ${{ matrix.ref }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        ref:
          - rebase/1803
          - check/ops-1803-masterplain
          - check/ops-1803-master
          - check/ops-1803-noaddrerr
          - check/ops-1803-hostmsg
          - check/ops-1803-nostatus
          - check/ops-1803-notimeout
          - check/ops-1803-ownclient
          - check/ops-1803-newreqerr
          - check/ops-1803-nilresp
          - check/ops-1803-escape-ip
          - check/ops-1803-escape-host
          - check/ops-1803-lastsleep
          - check/ops-1803-tries19
          - check/ops-1803-timeout1h
          - check/ops-1803-poll400
          - check/ops-1803-upnoreg
    steps:
      - uses: actions/checkout@v4
        with:
          repository: AngeloRubens/ops
          ref: ${{ matrix.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: qemu, so that the cmd tests find a hypervisor
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86

      - name: gofmt
        id: gofmt
        continue-on-error: true
        run: |
          unformatted=$(gofmt -l cmd/ lepton/ types/)
          if [ -n "$unformatted" ]; then echo "not gofmt'd: $unformatted"; gofmt -d cmd/ lepton/ types/; exit 1; fi

      - name: vet
        id: vet
        continue-on-error: true
        run: go vet ./cmd/... ./lepton/... ./types/...

      - name: build
        id: build
        continue-on-error: true
        run: go build -o ops -v

      - name: new tests by name
        id: named
        continue-on-error: true
        run: go test ./cmd/... ./lepton/... -count 1 -v -run 'RegisterService|AddDNS|WaitForIP'

      - name: full suite of cmd lepton types
        id: full
        continue-on-error: true
        shell: bash -eo pipefail {0}
        run: go test ./cmd/... ./lepton/... ./types/... -count 1 -v 2>&1 | tee full.log

      - name: outcome
        run: |
          echo "ref=${{ matrix.ref }} gofmt=${{ steps.gofmt.outcome }} vet=${{ steps.vet.outcome }} build=${{ steps.build.outcome }} named=${{ steps.named.outcome }} full=${{ steps.full.outcome }}"
          echo "---- FAIL lines of the full suite"
          grep -E '^(--- FAIL|FAIL|ok |panic)' full.log || true
