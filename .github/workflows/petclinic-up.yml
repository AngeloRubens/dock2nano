name: petclinic-up
# Converts examples/petclinic-glassfish, starts it with "ops compose up" and reports how far
# it gets. No assertion on the result: the output is the finding. Runs on a push whose head
# commit message contains [petclinic-up], and by hand.
on:
  push:
  workflow_dispatch:
    inputs:
      cpus:
        description: 'number of CPUs of the petclinic package (empty: ops default)'
        required: false
        default: ''
      nightly:
        description: 'use the nightly nanos kernel (it reads uid and gid from the manifest, nanovms/nanos#2189)'
        required: false
        default: 'true'
      rootfix:
        description: 'add --user=root to mysqld by hand (not needed when the kernel reads the uid)'
        required: false
        default: 'false'
      nouid:
        description: 'remove uid and gid from the manifest of the db package (to compare)'
        required: false
        default: 'false'
      dbargs:
        description: 'extra mysqld arguments (space separated)'
        required: false
        default: ''
      jvmflags:
        description: 'extra JVM options for the petclinic package (space separated); -Xint because the compiled code crashes the JVM on nanos'
        required: false
        default: '-Xint'
permissions:
  contents: read
env:
  # the nanovms/ops commit these jobs build (master)
  OPS_REF: 11835380d63576a0a7d3021cc176bf3cd4c60935
jobs:
  up:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[petclinic-up]')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OPS_HOME: /home/runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: machine
        run: |
          ls -l /dev/kvm || echo "no /dev/kvm"
          nproc; free -m; id
          docker version --format '{{.Server.Version}}'
      - name: qemu
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 qemu-utils iproute2 dnsutils dnsmasq >/dev/null
      - name: ops from source
        run: |
          git clone https://github.com/nanovms/ops /tmp/ops-src
          git -C /tmp/ops-src checkout "$OPS_REF"
          cd /tmp/ops-src && git log --oneline | head -1
          go build -o /tmp/ops .
          sudo install /tmp/ops /usr/local/bin/ops
          ops version
      - name: kernel and boot image
        env:
          NIGHTLY: ${{ github.event.inputs.nightly }}
        run: |
          ops update 2>&1 | tail -5
          if [ "${NIGHTLY:-true}" = true ]; then
            mkdir -p /tmp/nightly
            curl -fsSL https://storage.googleapis.com/nanos/release/nightly/nanos-nightly-linux.tar.gz | tar xz -C /tmp/nightly
            ls -la /tmp/nightly
            rel="$OPS_HOME/.ops/$(cat "$OPS_HOME/.ops/latest.txt")"
            ls -la "$rel"
            for f in kernel.img boot.img; do
              src=$(find /tmp/nightly -name "$f" | head -1)
              [ -n "$src" ] && cp -f "$src" "$rel/$f" && echo "replaced $rel/$f from $src"
            done
          fi
      - name: convert
        run: |
          set -o pipefail
          mkdir -p /tmp/out
          go run . convert -f examples/petclinic-glassfish/docker-compose.yml --ops-home "$OPS_HOME" -o /tmp/out --pull --seconds 120 | tee /tmp/out/report.txt
          cat /tmp/out/compose.yaml
          find "$OPS_HOME/.ops/local_packages" -maxdepth 3 | head -20
          for m in "$OPS_HOME"/.ops/local_packages/*/*/package.manifest; do echo "== $m"; head -c 3000 "$m"; echo; done
          du -sh "$OPS_HOME"/.ops/local_packages/*/*
      - name: review the report (the two changes it asks for)
        env:
          JVMFLAGS: ${{ github.event.inputs.jvmflags }}
          ROOTFIX: ${{ github.event.inputs.rootfix }}
          NOUID: ${{ github.event.inputs.nouid }}
          DBARGS: ${{ github.event.inputs.dbargs }}
          CPUS: ${{ github.event.inputs.cpus }}
        run: |
          # What the report names, done by hand: mysqld looks up the names of its clients (the DNS of
          # ops compose does not answer), and the host db is db.service on ops. The uid 999 of mysqld
          # is in the manifest (uid, gid): the nightly kernel honours it.
          pk="$OPS_HOME/.ops/local_packages/amd64"
          python3 - "$pk/petclinic-glassfish_db/package.manifest" <<'PY'
          import json, os, sys
          p = sys.argv[1]
          m = json.load(open(p))
          extras = ["--skip-name-resolve"]
          if os.environ.get("ROOTFIX") == "true":
              extras.insert(0, "--user=root")
          for extra in extras:
              if extra not in m["Args"]:
                  m["Args"].append(extra)
          for extra in os.environ.get("DBARGS", "").split():
              if extra not in m["Args"]:
                  m["Args"].append(extra)
          if os.environ.get("NOUID") == "true":
              for k in ("uid", "gid"):
                  m.get("ManifestPassthrough", {}).pop(k, None)
          json.dump(m, open(p, "w"), indent=2)
          PY
          grep -n -A3 '"Args"' "$pk/petclinic-glassfish_db/package.manifest" | head -8
          if [ -n "$CPUS" ]; then
            python3 - "$pk/petclinic-glassfish_petclinic/package.manifest" "$CPUS" <<'PY'
          import json, sys
          p = sys.argv[1]
          m = json.load(open(p))
          m.setdefault("RunConfig", {})["CPUs"] = int(sys.argv[2])
          json.dump(m, open(p, "w"), indent=2)
          PY
            echo "CPUs: $CPUS"
          fi
          if [ -n "$JVMFLAGS" ]; then
            python3 - "$pk/petclinic-glassfish_petclinic/package.manifest" "$JVMFLAGS" <<'PY'
          import json, sys
          p = sys.argv[1]
          m = json.load(open(p))
          m["Args"][1:1] = sys.argv[2].split()
          json.dump(m, open(p, "w"), indent=2)
          PY
            echo "JVM options added: $JVMFLAGS"
          fi
          dom="$pk/petclinic-glassfish_petclinic/sysroot/opt/glassfish7/glassfish/domains/domain1/config/domain.xml"
          grep -n 'serverName' "$dom" | cut -c1-200
          sed -i 's/\(name="serverName" value="\)db"/\1db.service"/' "$dom"
          grep -n 'serverName' "$dom" | cut -c1-200
      - name: dns package
        run: ops pkg get eyberg/ops-dns:0.0.1
      - name: compose up
        timeout-minutes: 10
        run: |
          cd /tmp/out
          # a file, not a pipe: the qemu processes outlive ops and would hold a pipe open
          # ops compose waits ten seconds for each address and panics when the dns one is late:
          # try again, from a clean state
          for attempt in 1 2 3; do
            if sudo env OPS_HOME="$OPS_HOME" PATH="$PATH" ops compose up -f /tmp/out/compose.yaml --show-debug > /tmp/out/up.log 2>&1; then
              # ops adds the dns record of a service even when it did not find its address in ten
              # seconds, with an empty address: the name then never resolves
              if grep -q "^adding record .* for *$" /tmp/out/up.log; then
                echo "a dns record was added without an address (attempt $attempt)"
              else
                break
              fi
            fi
            echo "ops compose up failed (attempt $attempt)"
            grep -v "^no ip found\|^couldn't find mac\|^mac is an empty" /tmp/out/up.log | tail -8 | cut -c1-200
            sudo env OPS_HOME="$OPS_HOME" ops compose down > /dev/null 2>&1 || true
            sleep 5
            test "$attempt" -lt 3
          done
          grep -v "^no ip found\|^couldn't find mac\|^mac is an empty" /tmp/out/up.log | cut -c1-300 | tail -40
      - name: probe
        if: always()
        run: |
          sleep 20
          ip -br addr | head -20
          sudo env OPS_HOME="$OPS_HOME" ops instance list 2>&1 | tee /tmp/out/instances.txt
          ipof() { grep -o 'assigned 192\.168\.33\.[0-9]*' /tmp/out/console-$1.txt 2>/dev/null | tail -1 | awk '{print $2}'; }
          for n in db petclinic dns; do
            echo "=== console of $n"
            sudo env OPS_HOME="$OPS_HOME" ops instance logs $n > /tmp/out/console-$n.txt 2>&1 || true
            tail -40 /tmp/out/console-$n.txt | cut -c1-300
          done
          app=$(ipof petclinic); db=$(ipof db)
          echo "petclinic=$app db=$db"
          # up to ten minutes for the web application, then report what answers
          for i in $(seq 1 120); do
            if [ -n "$app" ] && curl -s -m 5 -o /tmp/out/index.html -w '%{http_code}\n' "http://$app:8080/home.jsf" | tee /tmp/out/http-code.txt | grep -q '^[23]'; then break; fi
            sleep 15
            sudo env OPS_HOME="$OPS_HOME" ops instance logs petclinic > /tmp/out/console-petclinic.txt 2>&1 || true
          done
          for u in home.jsf owner.jsf petType.jsf veterinarian.jsf; do echo "=== GET $u"; curl -s -m 120 -o /tmp/out/$u.html -w '%{http_code}\\n' "http://$app:8080/$u" || true; sed -e 's/<[^>]*>/ /g' /tmp/out/$u.html | tr -s ' \n' | head -c 2500; echo; done
          sudo env OPS_HOME="$OPS_HOME" ops instance logs petclinic > /tmp/out/console-petclinic.txt 2>&1 || true
          echo "=== errors in the console after the requests"; grep -n -B2 -A12 'Communications\|UnknownHost\|Access denied\|PersistenceException\|SQLException\|jakarta.persistence' /tmp/out/console-petclinic.txt | tail -60 | cut -c1-300
          echo "=== the database asked from this machine (db=$db)"
          if [ -n "$db" ]; then
            docker run --rm --entrypoint mysql mysql:8.4 -h "$db" -uroot -prootpass -e 'select 1 as ok; show tables' petclinic 2>&1 | head -12
            docker run --rm --entrypoint mysql mysql:8.4 -h "$db" -upetclinic -ppetclinic -e 'select 1 as ok_app_user' petclinic 2>&1 | head -4
          fi
          echo "=== last answer"; cat /tmp/out/http-code.txt 2>/dev/null; head -c 600 /tmp/out/index.html 2>/dev/null
          echo "=== console of petclinic, last 60 lines"; tail -60 /tmp/out/console-petclinic.txt | cut -c1-300
          echo "=== console of db, last 30 lines"; sudo env OPS_HOME="$OPS_HOME" ops instance logs db 2>&1 | tail -30 | cut -c1-300
          ps -eo args | grep '[q]emu-system' | cut -c1-500 | head -4
          ps aux | grep -c '[q]emu' || true
          free -m | head -2
      - name: artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: petclinic-up
          path: /tmp/out
      - name: down
        if: always()
        run: cd /tmp/out && sudo env OPS_HOME="$OPS_HOME" ops compose down 2>&1 | tail -5 || true
