name: revert4
on:
  push:
    branches: ['check/top30-revert4']
permissions:
  contents: read
jobs:
  revert:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        name: ["init-passover", "init-names-catatonit-dockerinit", "init-arch-and-version-names", "starter-roots", "starter-notrun", "starter-childlaunchers", "cwd-at-execve", "cwd-shared-by-threads", "pid-changed-execve", "superseded-swap", "home-of-user", "named-user-lookup", "home-unknown-warning", "passwd-home", "link-dir-outside-sysroot", "link-target-outside-sysroot", "link-to-itself", "link-into-own-subdir", "link-to-ancestor", "link-clash", "link-dir-modes", "link-readonly-source", "newlink-parent-outside", "copy-parent-outside", "skipped-is-a-warning", "launcher-note-leaves-init-out", "npm-sentence-only-for-launchers", "init-passed-over-note", "init-kept-item", "supervisor-message", "supervisor-by-name", "supervisor-python-option"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: apply the revert of one change
        run: python3 ci/revert4/apply.py "${{ matrix.name }}"
      - name: build
        run: go build ./... && go vet ./...
      - name: tests of the changed modules, with the change removed
        run: |
          go test ./internal/... ./cmd/... 2>&1 | tee /tmp/t.log || true
          echo "REVERT ${{ matrix.name }}: failed tests:"; grep -E "^\s*--- FAIL" /tmp/t.log | sort -u
          if grep -q "^FAIL" /tmp/t.log; then echo "REVERT ${{ matrix.name }} RED"; exit 1; else echo "REVERT ${{ matrix.name }} GREEN (no test noticed)"; fi
