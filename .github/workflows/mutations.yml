name: mutations
on:
  push:
    branches: ['check/**']
jobs:
  list:
    runs-on: ubuntu-24.04
    outputs:
      names: ${{ steps.l.outputs.names }}
    steps:
      - uses: actions/checkout@v4
      - id: l
        run: echo "names=$(python3 ci/mutate.py list | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read().split()))')" >> "$GITHUB_OUTPUT"
  mutate:
    needs: list
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJson(needs.list.outputs.names) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: python3 ci/mutate.py ${{ matrix.name }}
