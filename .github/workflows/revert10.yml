name: revert10
on:
  push:
    branches: ['check/top30-nearest-revert3']
permissions:
  contents: read
jobs:
  revert:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        name: ["nearest-rule-off", "nearest-fork-order-decides", "nearest-later-fork-wins", "nearest-nearer-wins", "nearest-shells-are-not-the-program", "nearest-shell-by-file-name", "nearest-busybox-is-not-the-program", "nearest-ps-is-not-the-program", "nearest-waiters-are-not-the-program", "nearest-copiers-are-not-the-program", "nearest-sleep-in-the-list", "nearest-tail-in-the-list", "nearest-watch-in-the-list", "nearest-tee-in-the-list", "nearest-cat-in-the-list", "nearest-logger-in-the-list", "nearest-rotatelogs-in-the-list", "nearest-cronolog-in-the-list", "nearest-svlogd-in-the-list", "nearest-multilog-in-the-list", "nearest-zsh-is-a-shell", "nearest-ksh-is-a-shell", "nearest-mksh-is-a-shell", "nearest-supervisors-are-not-the-program", "nearest-supervisor-when-nothing-else", "nearest-under-a-supervisor-is-its-own", "nearest-exited-are-not-candidates", "nearest-only-for-a-shell", "nearest-subshell-is-the-shell", "beside-recorded", "beside-by-the-plain-label", "beside-label-java", "beside-label-interpreters", "beside-label-module", "beside-leaves-out-what-is-below-the-program", "beside-leaves-out-shells", "beside-leaves-out-what-is-under-a-supervisor", "beside-handed-on", "beside-carried-by-observe", "beside-item-in-the-report", "beside-wording", "hub-whole-names-beside"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: apply the revert of one change
        run: python3 ci/revert/apply.py "${{ matrix.name }}"
      - name: build
        run: go build ./... && go vet ./...
      - name: tests, with the change removed
        run: |
          go test ./internal/... ./cmd/... 2>&1 | tee /tmp/t.log || true
          echo "REVERT ${{ matrix.name }}: failed tests:"; grep -E "^\s*--- FAIL" /tmp/t.log | sort -u
          if grep -q "^FAIL" /tmp/t.log; then echo "REVERT ${{ matrix.name }} RED"; exit 1; else echo "REVERT ${{ matrix.name }} GREEN (no test noticed)"; fi
