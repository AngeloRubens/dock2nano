name: top30
# Rows of docs/top30.md (the 30 Dockerfiles, and the section Java and .NET): a repository at a pinned sha,
# a Dockerfile path inside it and a build context, converted unmodified: docker builds the image, dock2nano
# converts the Dockerfile (--dockerfile, --context, --name) to a nanos package and a compose.yaml, ops compose
# up starts it, and the strict probe asks the port (2xx or 3xx, or an open TCP port is green). Every row prints
# "ROW" lines: that is the measured record. Runs on a push to a check/** branch and by hand.
on:
  push:
    branches: ['check/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  row:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OPS_HOME: /home/runner
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: helidon-a, repo: helidon-io/helidon-examples, sha: 1ea90c465d86828922ae0ad04a06bbf8b43ef5d6, dockerfile: examples/quickstarts/helidon-quickstart-se/Dockerfile, context: "examples/quickstarts/helidon-quickstart-se", port: "8080", probe: http, kvm: "yes", env: "", tries: "60", cargs: "", mkdirs: "", copy: "", path: "/greet", jq: ""}
          - {name: helidon-b, repo: helidon-io/helidon-examples, sha: 1ea90c465d86828922ae0ad04a06bbf8b43ef5d6, dockerfile: examples/quickstarts/helidon-quickstart-se/Dockerfile, context: "examples/quickstarts/helidon-quickstart-se", port: "8080", probe: http, kvm: "yes", env: "", tries: "60", cargs: "", mkdirs: "", copy: "", path: "/greet", jq: ""}
          - {name: petclinic-kt-a, repo: spring-petclinic/spring-petclinic-kotlin, sha: 9823b3aa97988854668e608750db88502775caa7, dockerfile: Dockerfile, context: ".", port: "8080", probe: http, kvm: "yes", env: "", tries: "60", cargs: "", mkdirs: "", copy: "", path: "/", jq: ""}
          - {name: petclinic-kt-b, repo: spring-petclinic/spring-petclinic-kotlin, sha: 9823b3aa97988854668e608750db88502775caa7, dockerfile: Dockerfile, context: ".", port: "8080", probe: http, kvm: "yes", env: "", tries: "60", cargs: "", mkdirs: "", copy: "", path: "/", jq: ""}
          - {name: btcpay-a, repo: btcpayserver/btcpayserver, sha: 06ca9c21682fa87c3124bd2cf9c4e3cc7bee22f2, dockerfile: Dockerfile, context: ".", port: "49392", probe: http, kvm: "yes", env: "", tries: "60", cargs: "", mkdirs: "", copy: "", path: "/", jq: ""}
          - {name: btcpay-b, repo: btcpayserver/btcpayserver, sha: 06ca9c21682fa87c3124bd2cf9c4e3cc7bee22f2, dockerfile: Dockerfile, context: ".", port: "49392", probe: http, kvm: "yes", env: "", tries: "60", cargs: "", mkdirs: "", copy: "", path: "/", jq: ""}
          - {name: btcpay-c, repo: btcpayserver/btcpayserver, sha: 06ca9c21682fa87c3124bd2cf9c4e3cc7bee22f2, dockerfile: Dockerfile, context: ".", port: "49392", probe: http, kvm: "yes", env: "", tries: "60", cargs: "", mkdirs: "", copy: "", path: "/", jq: ""}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: docker version
        run: docker version
      - name: the tool
        run: for i in 1 2 3; do go build -o "$RUNNER_TEMP/d2n" . && break; sleep 20; done; test -x "$RUNNER_TEMP/d2n"
      - name: kvm (state of /dev/kvm, the udev rule only for the rows with kvm yes)
        env:
          KVM: ${{ matrix.kvm }}
        run: |
          echo "ROW kvm requested=$KVM nproc=$(nproc) cpu flags vmx/svm lines=$(grep -c -E 'vmx|svm' /proc/cpuinfo || true) user=$(id -un)"
          echo "ROW kvm before: $(ls -l /dev/kvm 2>&1)"
          if [ "$KVM" = yes ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            sleep 2
            # ops compose does not set Accel in its RunConfig (cmd/compose.go), so qemu runs without accel=kvm and with -cpu max.
            # Measurement only: a wrapper in front of qemu-system-x86_64 adds accel=kvm and -cpu host. It changes nothing else.
            sudo tee /usr/local/bin/qemu-system-x86_64 >/dev/null <<'WRAP'
          #!/bin/bash
          args=(); prev=""
          for a in "$@"; do
            if [ "$prev" = -machine ] && [ "$a" = q35 ]; then a="q35,accel=kvm"; fi
            if [ "$prev" = -cpu ] && [ "$a" = max ]; then a="host"; fi
            args+=("$a"); prev="$a"
          done
          echo "$(date +%T) qemu ${args[*]}" >> /tmp/qemu-wrapper.log
          exec /usr/bin/qemu-system-x86_64 "${args[@]}"
          WRAP
            sudo chmod 755 /usr/local/bin/qemu-system-x86_64
          fi
          echo "ROW kvm after: $(ls -l /dev/kvm 2>&1)"
          echo "ROW kvm access for root: $(sudo test -r /dev/kvm -a -w /dev/kvm && echo rw || echo no)"
      - name: qemu
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 qemu-utils iproute2 dnsutils dnsmasq >/dev/null
      - name: ops from source (nanovms/ops master 2177c549, with the arp fix of PR 1805 and PRs 1815-1818)
        run: |
          git clone https://github.com/nanovms/ops /tmp/ops-src
          git -C /tmp/ops-src checkout 2177c549df3fab2662d6386042c74bec859275bd
          git -C /tmp/ops-src merge-base --is-ancestor 987e075bbcc71e0384ec86edd2c79e1d908be8ff HEAD; echo "1805 ancestor of 2177c549: $?"
          cd /tmp/ops-src && git rev-parse HEAD^ HEAD && git log --oneline | head -1
          for i in 1 2 3; do go build -o /tmp/ops . && break; echo "go build of ops failed, try $i"; sleep 20; done; test -x /tmp/ops && sudo install /tmp/ops /usr/local/bin/ops
      - name: nanos kernel (nightly, it reads uid and gid from the manifest)
        run: |
          ops update 2>&1 | tail -3
          mkdir -p /tmp/nightly
          curl -fsSL https://storage.googleapis.com/nanos/release/nightly/nanos-nightly-linux.tar.gz | tar xz -C /tmp/nightly
          rel="$OPS_HOME/.ops/$(cat "$OPS_HOME/.ops/latest.txt")"
          for f in kernel.img boot.img; do
            src=$(find /tmp/nightly -name "$f" | head -1)
            [ -n "$src" ] && cp -f "$src" "$rel/$f" && echo "replaced $f"
          done
          sudo install /tmp/ops /usr/local/bin/ops
          ops pkg get eyberg/ops-dns:0.0.1
      - name: the row (source, docker build, convert, the printed commands, probe)
        env:
          NAME: ${{ matrix.name }}
          REPO: ${{ matrix.repo }}
          SHA: ${{ matrix.sha }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          CTX: ${{ matrix.context }}
          PORT: ${{ matrix.port }}
          KIND: ${{ matrix.probe }}
          FULL: ${{ matrix.full }}
          XENV: ${{ matrix.env }}
          TRIES: ${{ matrix.tries }}
          XPRE: ${{ matrix.pre }}
          XCARGS: ${{ matrix.cargs }}
          XMKDIRS: ${{ matrix.mkdirs }}
          XCOPY: ${{ matrix.copy }}
          XPATH: ${{ matrix.path }}
          XJQ: ${{ matrix.jq }}
          KVM: ${{ matrix.kvm }}
        run: |
          set -u
          R=/tmp/out/$NAME
          mkdir -p "$R"
          srcok=no; bld=not-run; conv=no; started=no; probe=not-run; upn=0
          finish() {
            echo "ROW result name=$NAME source=$srcok docker_build=$bld converted=$conv started=$started probe=$probe ops=$(git -C /tmp/ops-src rev-parse --short HEAD 2>/dev/null) dock2nano=$(git -C "$GITHUB_WORKSPACE" rev-parse --short HEAD)"
          }
          trap finish EXIT
          echo "ROW name=$NAME repo=$REPO sha=$SHA dockerfile=$DOCKERFILE context=$CTX port=$PORT probe=$KIND"
          echo "ROW dock2nano commit: $(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          echo "ROW ops commit: $(git -C /tmp/ops-src rev-parse HEAD)"

          # 1. the source at the pinned commit, unmodified. The directory is named after the row, so the
          # default name of the conversion (the name of the context directory) is the row name.
          W=/tmp/w/$NAME
          rm -rf "$W" && mkdir -p "$W" && cd "$W"
          git init -q && git remote add origin "https://github.com/$REPO.git"
          if { [ "$REPO" = local ] && cp -r "$GITHUB_WORKSPACE/$SHA/." "$W/"; } || { git fetch -q --depth 1 origin "$SHA" && git checkout -q FETCH_HEAD; }; then
            if [ "${FULL:-}" = yes ]; then git fetch -q --filter=blob:none --unshallow --tags origin && echo "ROW full history and tags fetched: $(git describe --tags --always)"; fi
            srcok=yes; echo "ROW source=ok $(git log --oneline -1 | cut -c1-100)"
          else
            echo "ROW source=fail: git fetch or checkout of $SHA"; exit 1
          fi
          [ -f "$DOCKERFILE" ] || { echo "ROW no Dockerfile at $DOCKERFILE"; exit 1; }

          # 2. build with docker (timed here; the conversion builds the image again)
          s=$(date +%s)
          if [ -n "${XPRE:-}" ]; then echo "ROW pre-build in $CTX: $XPRE"; (cd "$W/$CTX" && eval "$XPRE") > "$R/prebuild.log" 2>&1; echo "ROW pre-build exit $?"; tail -5 "$R/prebuild.log"; fi
          if docker build -t "top30-$NAME" -f "$W/$DOCKERFILE" "$W/$CTX" > "$R/docker-build.log" 2>&1; then bld=ok; else bld=fail; fi
          echo "ROW docker_build=$bld seconds=$(( $(date +%s) - s ))"
          if [ "$bld" = fail ]; then
            echo "ROW docker_build error lines:"; grep -i "error\|failed\|not found" "$R/docker-build.log" | tail -4 | cut -c1-240
            # the tool is run on the Dockerfile as it is, with the same flags as below; the tool builds the image itself
            cd "$GITHUB_WORKSPACE"
            # the job shell is bash -e: a failing convert must not end the step before its ROW lines
            xexit=0
            "$RUNNER_TEMP/d2n" convert --dockerfile "$W/$DOCKERFILE" --context "$W/$CTX" --name "$NAME" -o "$R/compose-after-build-fail" --ops-home "$OPS_HOME" --pull > "$R/report-after-build-fail.txt" 2>&1 || xexit=$?
            echo "ROW convert after the failed docker build: convert_exit=$xexit; output of the tool, first 12 lines:"
            head -12 "$R/report-after-build-fail.txt" | cut -c1-300
            echo "ROW convert after the failed docker build: convert_exit=$xexit, output lines=$(wc -l < "$R/report-after-build-fail.txt")"
            echo "ROW convert after the failed docker build: compose.yaml written: $([ -f "$R/compose-after-build-fail/compose.yaml" ] && echo yes || echo no)"
            echo "ROW convert run after the failed docker build: the row stops here"; exit 1
          fi

          # 2b. evidence: the image as docker runs it, and the raw strace of the observation
          docker inspect --format '{{json .Config}}' "top30-$NAME" > "$R/image-config.json" 2>&1 || true
          echo "ROW image config: $(cut -c1-700 "$R/image-config.json")"
          docker run -d --name "run-$NAME" "top30-$NAME" > /dev/null 2>&1 || true
          sleep "${DRUN:-30}"
          docker logs "run-$NAME" > "$R/docker-run.log" 2>&1 || true
          echo "ROW docker run of the image as it is (${DRUN:-30} s): $(wc -l < "$R/docker-run.log") lines; first 12 and last 8:"
          head -12 "$R/docker-run.log" | cut -c1-250; echo ...; tail -8 "$R/docker-run.log" | cut -c1-250
          echo "ROW docker top of the container:"; docker top "run-$NAME" -eo pid,ppid,args 2>&1 | cut -c1-1800 | head -25
          docker rm -f "run-$NAME" >/dev/null 2>&1 || true
          mkdir -p "$R/trace"; export DOCK2NANO_KEEP_TRACE="$R/trace"

          # 3. convert, with the flags of the usage text: --ops-home, -o, --pull; the rest is the default
          cd "$GITHUB_WORKSPACE"
          CARGS_ARR=(); if [ -n "${XCARGS:-}" ]; then eval "CARGS_ARR=($XCARGS)"; echo "ROW extra arguments of convert: $XCARGS"; fi
          "$RUNNER_TEMP/d2n" convert --dockerfile "$W/$DOCKERFILE" --context "$W/$CTX" --name "$NAME" -o "$R/compose" --ops-home "$OPS_HOME" --pull "${CARGS_ARR[@]}" > "$R/report.txt" 2>&1
          cexit=$?
          cat "$R/report.txt" | cut -c1-300
          echo "ROW convert_exit=$cexit"
          if [ "$cexit" = 0 ] && [ -f "$R/compose/compose.yaml" ]; then conv=yes; fi
          echo "ROW report lines that name something not converted (quoted from the report):"
          grep -i "not \|unsupported\|cannot\|could not\|left out\|dropped\|ignored\|no image\|skipped" "$R/report.txt" | cut -c1-300 | head -40
          if [ "$conv" != yes ]; then
            echo "ROW first error of the conversion: $(grep -i -m1 "error" "$R/report.txt" | cut -c1-300)"
            exit 1
          fi
          echo "ROW compose.yaml:"; cut -c1-200 "$R/compose/compose.yaml"

          # measurement only: variables put into the manifest of the package (the tool does not do this)
          if [ -n "${XMKDIRS:-}" ]; then
            for P in "$OPS_HOME"/.ops/local_packages/amd64/${NAME}_*; do
              for d in $XMKDIRS; do mkdir -p "$P/sysroot/$d" && echo "ROW made directory $P/sysroot/$d (measurement)"; done
            done
          fi
          if [ -n "${XCOPY:-}" ]; then
            docker create --name "cp-$NAME" "top30-$NAME" > /dev/null
            for P in "$OPS_HOME"/.ops/local_packages/amd64/${NAME}_*; do
              for d in $XCOPY; do mkdir -p "$P/sysroot$(dirname "$d")" && docker cp "cp-$NAME:$d" "$P/sysroot$(dirname "$d")/" && echo "ROW copied $d from the image into the sysroot (measurement): $(du -sh "$P/sysroot$d" | cut -f1)"; done
            done
            docker rm -f "cp-$NAME" > /dev/null
          fi
          for P in "$OPS_HOME"/.ops/local_packages/amd64/${NAME}_*; do
            echo "ROW hostname file of the package (made by the tool): $(cat "$P/sysroot/etc/hostname" 2>&1)"
            echo "ROW etc/hosts of the package:"; cat "$P/sysroot/etc/hosts" 2>&1
          done
          if [ -n "${XJQ:-}" ]; then
            for mf in $(find "$OPS_HOME/.ops/local_packages" -name package.manifest | grep -v "/ops-dns" | sort -u); do
              jq "$XJQ" "$mf" > "$mf.new" && mv "$mf.new" "$mf" && echo "ROW applied to $mf (measurement): $XJQ" && jq -c .ManifestPassthrough "$mf"
            done
          fi
          if [ -n "${XENV:-}" ]; then
            for mf in $(find "$OPS_HOME/.ops/local_packages" -name package.manifest | grep -v "/ops-dns" | sort -u); do
              echo "ROW injected env into $mf: $XENV"
              for kv in $XENV; do jq --arg k "${kv%%=*}" --arg v "${kv#*=}" '.Env[$k]=$v' "$mf" > "$mf.new" && mv "$mf.new" "$mf"; done
              jq -c .Env "$mf" | cut -c1-600
            done
          fi
          # 4. the commands that the "Next steps" of the report print, run exactly as printed.
          # the ops pkg line is "(once, if you do not have it yet)"; the up line is "sudo env ... ops compose up -f ..."
          pkgcmd=$(grep -m1 "ops pkg get" "$R/report.txt" | sed -e 's/^ *//' -e 's/ *(once.*$//')
          echo "ROW printed pkg command: $pkgcmd"
          [ -n "$pkgcmd" ] && eval "$pkgcmd" 2>&1 | tail -2
          upcmd=$(grep -m1 "ops compose up -f" "$R/report.txt" | sed -e 's/^ *//')
          echo "ROW printed up command: $upcmd"
          # limits.md documents that ops compose up needs retries (the dns instance can be late): up to three tries
          up_ok=0
          for attempt in 1 2 3; do
            upn=$attempt
            if timeout 420 bash -c "$upcmd" > "$R/up.log" 2>&1; then up_ok=1; echo "ROW compose_up=ok attempt=$attempt"; break; fi
            echo "ROW compose_up=failed attempt=$attempt"
            grep -v "^no ip found\|^couldn't find mac\|^mac is an empty\|Manifest:\|&{root" "$R/up.log" | cut -c1-200 | tail -6
            cp "$R/up.log" "$R/up-attempt-$attempt.log"
            # the instance and its console, before the down of the next try removes them
            timeout 90 sudo env OPS_HOME="$OPS_HOME" ops instance list > "$R/instances-attempt-$attempt.txt" 2>&1 || true
            timeout 90 sudo env OPS_HOME="$OPS_HOME" ops instance logs "$NAME" > "$R/console-attempt-$attempt.txt" 2>&1 || true
            echo "ROW attempt=$attempt listening-lines=$(grep -c "Now listening\|Server startup\|started in" "$R/console-attempt-$attempt.txt") crash-lines=$(grep -c "signal 11\|General protection\|Page fault" "$R/console-attempt-$attempt.txt")"
            echo "ROW attempt=$attempt console of $NAME: $(wc -l < "$R/console-attempt-$attempt.txt") lines; first lines:"
            head -6 "$R/console-attempt-$attempt.txt" | cut -c1-200
            if [ "$attempt" -lt 3 ]; then timeout 90 sudo env OPS_HOME="$OPS_HOME" ops compose down > /dev/null 2>&1 || true; sleep 5; fi
          done
          if [ "$up_ok" != 1 ]; then
            echo "ROW first error of ops compose up: $(grep -v "^no ip found\|^couldn't find mac\|^mac is an empty" "$R/up.log" | grep -i -m1 "error\|fail\|fatal\|timeout\|panic" | cut -c1-300)"
            exit 1
          fi
          started=yes

          # 5. post-up scripts: the report says "then, once X is up: <command>", the user runs it; run the printed command
          grep "then, once" "$R/report.txt" | sed -e 's/^.*is up: //' -e 's/    (ops compose does not run it.*$//' | while IFS= read -r pu; do
            echo "ROW printed post-up command: $pu"; sleep 30; eval "$pu" 2>&1 | tail -5
          done

          # 6. the strict probe: 2xx or 3xx, or an open TCP port, is the only green
          sleep 60
          timeout 90 sudo env OPS_HOME="$OPS_HOME" ops instance list > "$R/instances.txt" 2>&1 || true
          timeout 90 sudo env OPS_HOME="$OPS_HOME" ops instance logs "$NAME" > "$R/console.txt" 2>&1 || true
          ip=$(grep -o 'assigned 192\.168\.33\.[0-9]*' "$R/console.txt" | tail -1 | awk '{print $2}')
          echo "ROW qemu command lines (accel flags):"; ps -eo args | grep "[q]emu-system" | grep -o -E "(-machine [^ ]*|-cpu [^ ]*|--enable-kvm|-accel [^ ]*|-m [^ ]*|-smp [^ ]*)" | sort | uniq -c
          echo "ROW address=${ip:-none}"
          if [ -z "$ip" ]; then probe=no-address; echo "ROW probe=no-address"; exit 1; fi
          codes=""; code=""
          for i in $(seq 1 ${TRIES:-24}); do
            if [ "$KIND" = http ]; then
              rm -f "$R/body.txt"
              code=$(curl -s -m 5 -H "Host: $ip:$PORT" -o "$R/body.txt" -w '%{http_code}' "http://$ip:$PORT${XPATH:-/}" || true)
              codes="$codes $code"
              if [ "$code" != 000 ]; then cp "$R/body.txt" "$R/body.last.txt" 2>/dev/null || true; fi
              case "$code" in 2*|3*) break;; esac
            else
              if timeout 5 bash -c "exec 3<>/dev/tcp/$ip/$PORT" 2>/dev/null; then code=open; break; else code=closed; fi
            fi
            [ "$i" = "${TRIES:-24}" ] || sleep 10
          done
          lastcode=""
          for c in $codes; do case "$c" in 000|"") ;; *) lastcode=$c;; esac; done
          echo "ROW address=$ip:$PORT answer=$code"
          if [ "$KIND" = http ]; then echo "ROW codes of the tries:$codes"; fi
          case "$code" in
            2*|3*|open) probe=success ;;
            4*|5*) probe="reached-status-$code" ;;
            *) if [ -n "$lastcode" ]; then probe="reached-status-$lastcode"; else probe=no-answer; fi ;;
          esac
          echo "ROW probe=$probe"
          if [ "$KIND" = http ]; then head -c 300 "$R/body.last.txt" 2>/dev/null; echo; fi
          echo "=== console of $NAME, last 25 lines"; tail -25 "$R/console.txt" | cut -c1-250
          [ "$probe" = success ] && exit 0
          exit 1
      - name: evidence (package, manifest, port scan)
        if: always()
        run: |
          N=${{ matrix.name }}
          R=/tmp/out/$N
          P=$(ls -d "$OPS_HOME"/.ops/local_packages/amd64/${N}_* 2>/dev/null | head -1)
          echo "ROW package dir: $P"
          if [ -n "$P" ]; then
            ls -la "$P" | head -20
            echo "ROW sysroot top level:"; ls -la "$P/sysroot" 2>&1 | head -40
            find "$P" -maxdepth 1 -type f -name '*.manifest' -exec cp {} "$R/" \; 2>/dev/null || true
            sudo find "$P" \( -type f -o -type l \) | sed "s|^$P||" | sort | gzip > "$R/package-files.txt.gz"
            echo "ROW package files: $(zcat "$R/package-files.txt.gz" | wc -l)"
            echo "ROW manifest:"; cat "$P"/package.manifest 2>/dev/null | cut -c1-400 | head -60 || true
          fi
          ip=$(grep -o 'assigned 192\.168\.33\.[0-9]*' "$R/console.txt" 2>/dev/null | tail -1 | awk '{print $2}')
          if [ -n "$ip" ]; then
            sudo apt-get install -y -qq nmap >/dev/null 2>&1 || true
            echo "ROW port scan of $ip (1-10000)"; timeout 120 sudo nmap -Pn -p 1-10000 --min-rate 1500 "$ip" 2>&1 | tail -12 | tee "$R/nmap.txt"
          fi
      - name: instance list and console (before the down step removes the instance)
        if: always()
        run: |
          N=${{ matrix.name }}
          mkdir -p "/tmp/out/$N"
          timeout 90 sudo env OPS_HOME="$OPS_HOME" ops instance list > "/tmp/out/$N/instances-final.txt" 2>&1 || true
          timeout 90 sudo env OPS_HOME="$OPS_HOME" ops instance logs "$N" > "/tmp/out/$N/console-final.txt" 2>&1 || true
          echo "=== ROW ops instance list (end of the row), exit of the list is in the artifact"
          sed 's/\x1b\[[0-9;]*m//g' "/tmp/out/$N/instances-final.txt" | cut -c1-200
          echo "=== ROW ops instance logs $N (end of the row): $(wc -l < "/tmp/out/$N/console-final.txt") lines"
          cut -c1-250 "/tmp/out/$N/console-final.txt"
      - name: down
        if: always()
        run: |
          cd /tmp/out/${{ matrix.name }}/compose 2>/dev/null && timeout 90 sudo env OPS_HOME="$OPS_HOME" ops compose down 2>&1 | tail -3 || true
      - name: artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: top30-${{ matrix.name }}
          path: /tmp/out/${{ matrix.name }}
          if-no-files-found: ignore
