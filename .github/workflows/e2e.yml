name: e2e
# Converts examples/two-services and starts it with "ops compose up". It runs on
# a push whose head commit message contains [e2e], and by hand.
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  up:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[e2e]')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      OPS_HOME: /home/runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: machine
        run: |
          ls -l /dev/kvm || echo "no /dev/kvm"
          nproc; free -m; id
          docker version --format '{{.Server.Version}}'
      - name: qemu
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 qemu-utils iproute2 dnsutils dnsmasq >/dev/null
      - name: ops from source
        run: |
          git clone https://github.com/nanovms/ops /tmp/ops-src
          git -C /tmp/ops-src checkout a52795e38ba33a006f0ba740fee0f18fec58fbbb
          cd /tmp/ops-src && git log --oneline | head -1
          go build -o /tmp/ops .
          sudo install /tmp/ops /usr/local/bin/ops
          ops version
      - name: kernel and boot image
        run: ops update 2>&1 | tail -5
      - name: convert
        run: |
          set -o pipefail
          mkdir -p /tmp/out
          go run . convert -f examples/two-services/docker-compose.yml --ops-home "$OPS_HOME" -o /tmp/out --pull --seconds 20 | tee /tmp/out/report.txt
          cat /tmp/out/compose.yaml
          find "$OPS_HOME/.ops/local_packages" -maxdepth 3 | head -20
          cat "$OPS_HOME"/.ops/local_packages/*/demo_web/package.manifest
      - name: dns package
        run: ops pkg get eyberg/ops-dns:0.0.1
      - name: compose up
        timeout-minutes: 10
        run: |
          cd /tmp/out
          # a file, not a pipe: the qemu processes outlive ops and would hold a pipe open
          # ops compose waits ten seconds for each address and panics when the dns one is late:
          # try again, from a clean state
          for attempt in 1 2 3; do
            if sudo env OPS_HOME="$OPS_HOME" PATH="$PATH" ops compose up -f /tmp/out/compose.yaml --show-debug > /tmp/out/up.log 2>&1; then
              break
            fi
            echo "ops compose up failed (attempt $attempt)"
            grep -v "^no ip found\|^couldn't find mac\|^mac is an empty" /tmp/out/up.log | tail -8 | cut -c1-200
            sudo env OPS_HOME="$OPS_HOME" ops compose down > /dev/null 2>&1 || true
            sleep 5
            test "$attempt" -lt 3
          done
          grep -v "^no ip found\|^couldn't find mac\|^mac is an empty" /tmp/out/up.log | cut -c1-300 | tail -40
      - name: probe
        if: always()
        run: |
          sleep 15
          ip -br addr | head -20
          sudo env OPS_HOME="$OPS_HOME" ops instance list 2>&1 | tee /tmp/out/instances.txt
          for n in web app dns; do
            echo "=== console of $n"
            sudo env OPS_HOME="$OPS_HOME" ops instance logs $n 2>&1 | tail -25 | tee /tmp/out/console-$n.txt
          done
          ipof() { grep -o 'assigned 192\.168\.33\.[0-9]*' /tmp/out/console-$1.txt | tail -1 | awk '{print $2}'; }
          web=$(ipof web); app=$(ipof app)
          echo "web=$web app=$app"
          ip neigh show dev ops0
          for h in $web $app; do ping -c2 -W2 $h || echo "no ping to $h"; done
          test -n "$web" && test -n "$app"
          curl -fsS -m 10 "http://$web:8080/" | tee /tmp/out/web.txt
          curl -fsS -m 10 "http://$app:8081/" | tee /tmp/out/app.txt
          grep -qx "web ok" /tmp/out/web.txt
          grep -qx "app ok" /tmp/out/app.txt
          dnsip=$(grep -o 'assigned 192\.168\.33\.[0-9]*' /tmp/out/console-dns.txt | tail -1 | awk '{print $2}')
          dig +short +time=2 +tries=1 @$dnsip web.service | tee /tmp/out/dns-web.txt
          grep -qx "$web" /tmp/out/dns-web.txt
      - name: down
        if: always()
        run: cd /tmp/out && sudo env OPS_HOME="$OPS_HOME" ops compose down 2>&1 | tail -5 || true
