name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: format
        run: test -z "$(gofmt -l .)" || { gofmt -d .; exit 1; }
      - name: modules
        run: |
          go mod tidy
          git add -N go.sum
          git diff --exit-code go.mod go.sum
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
