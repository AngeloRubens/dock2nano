name: apache-hub
# Hub apache/php packages alone on nanos: inspect the package, then run with options. [apache-hub] or by hand.
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  try:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[apache-hub]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPS_HOME: /home/runner
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: B1-apache2458-8080, pkg: "eyberg/apache:2.4.58", port: 8080, cfg: "", args: ""}
          - {name: B2-apache2448-8080, pkg: "eyberg/apache:2.4.48", port: 8080, cfg: "", args: ""}
          - {name: C1-apache2458-mapdirs, pkg: "eyberg/apache:2.4.58", port: 8080, cfg: '{"MapDirs":{"app/*":"/usr/local/apache2/htdocs"}}', args: ""}
          - {name: C2-apache2448-mapdirs, pkg: "eyberg/apache:2.4.48", port: 8080, cfg: '{"MapDirs":{"app/*":"/usr/local/apache2/htdocs"}}', args: ""}
          - {name: D1-php81-builtin, pkg: "eyberg/php:8.1.27", port: 8080, cfg: '{"Dirs":["app"]}', args: "-S 0.0.0.0:8080 -t app"}
          - {name: E-wordpress, pkg: "eyberg/wordpress:6.6.1", port: 8080, cfg: '{"BaseVolumeSz":"300m"}', args: ""}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: qemu
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 qemu-utils iproute2 netcat-openbsd curl >/dev/null
      - name: ops from source (nanovms/ops master 2177c54)
        run: |
          git clone https://github.com/nanovms/ops /tmp/ops-src
          git -C /tmp/ops-src checkout 2177c549df3fab2662d6386042c74bec859275bd
          cd /tmp/ops-src && go build -o /tmp/ops . && sudo install /tmp/ops /usr/local/bin/ops
      - name: nanos kernel (nightly)
        run: |
          ops update 2>&1 | tail -3
          mkdir -p /tmp/nightly
          curl -fsSL https://storage.googleapis.com/nanos/release/nightly/nanos-nightly-linux.tar.gz | tar xz -C /tmp/nightly
          rel="$OPS_HOME/.ops/$(cat "$OPS_HOME/.ops/latest.txt")"
          for f in kernel.img boot.img; do
            src=$(find /tmp/nightly -name "$f" | head -1)
            [ -n "$src" ] && cp -f "$src" "$rel/$f" && echo "replaced $f"
          done
          sudo install /tmp/ops /usr/local/bin/ops
      - name: describe
        run: |
          pkg="${{ matrix.pkg }}"
          ops pkg get "$pkg" 2>&1 | grep -av '%' | tail -3
          echo "::group::ops pkg describe $pkg"
          ops pkg describe "$pkg" 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | grep -av '%' | head -60 || true
          echo "::endgroup::"
          pd=$(find "$OPS_HOME/.ops/packages/amd64" -mindepth 2 -maxdepth 2 -type d | head -1)
          cat "$pd/package.manifest"
      - name: run and probe
        env:
          CFG: ${{ matrix.cfg }}
          ARGS: ${{ matrix.args }}
        run: |
          git clone --depth 1 https://github.com/docker/awesome-compose /tmp/ac
          cd /tmp/ac/apache-php
          echo "::group::sample"; ls -R .; cat app/Dockerfile; cat app/index.php; cat compose.yaml; echo "::endgroup::"
          cfgflag=""
          if [ -n "$CFG" ]; then echo "$CFG" > /tmp/ac/apache-php/cfg.json; cfgflag="-c /tmp/ac/apache-php/cfg.json"; echo "config.json: $CFG"; fi
          argflags=""
          for a in $ARGS; do argflags="$argflags -a $a"; done
          port=${{ matrix.port }}
          echo "CMD: ops pkg load ${{ matrix.pkg }} -p $port $cfgflag $argflags"
          sudo env OPS_HOME="$OPS_HOME" PATH="$PATH" ops pkg load "${{ matrix.pkg }}" -p $port $cfgflag $argflags > /tmp/console.log 2>&1 &
          opspid=$!
          result=none
          for i in $(seq 1 20); do
            sleep 5
            if ! sudo kill -0 $opspid 2>/dev/null; then echo "ops exited early"; break; fi
            code=$(curl -s --max-time 5 -o /tmp/body.txt -w '%{http_code}' "http://127.0.0.1:$port/" || true)
            echo "probe $i: http $code"
            case "$code" in 000|"") ;; *) result=$code; break;; esac
          done
          echo "::group::body"; head -c 600 /tmp/body.txt; echo; echo "::endgroup::"
          code2=$(curl -s --max-time 5 -o /tmp/body2.txt -w '%{http_code}' "http://127.0.0.1:$port/index.php" || true)
          echo "index.php: http $code2"; head -c 600 /tmp/body2.txt; echo
          echo "::group::console, last 200 lines"
          tail -200 /tmp/console.log | cut -c1-400
          echo "::endgroup::"
          sudo kill $opspid 2>/dev/null || true
          sudo pkill -f qemu-system 2>/dev/null || true
          echo "RESULT ${{ matrix.name }}: $result"
