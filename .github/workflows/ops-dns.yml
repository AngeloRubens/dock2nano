name: ops-dns
# Checks the fix of the empty dns record of ops compose, kept on AngeloRubens/ops (branch
# fix/compose-empty-dns-record): gofmt, vet, the tests, and one mutation per job: each rule of the
# fix is taken out and the tests have to fail.
on:
  push:
    branches: ['check/ops-dns']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: AngeloRubens/ops
          ref: fix/compose-empty-dns-record
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: |
          unformatted=$(gofmt -l cmd/)
          if [ -n "$unformatted" ]; then echo "not gofmt'd: $unformatted"; gofmt -d cmd/; exit 1; fi
      - run: go vet ./cmd/...
      - run: go test ./cmd/... -count 1 -v -run 'RegisterService|AddDNS'
      - run: go build -o ops -v
  mutation:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        name: [empty-record-added, wait-ten-seconds, adddns-ignores-errors, adddns-ignores-newrequest-error, adddns-no-timeout, failed-service-is-not-an-error]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: AngeloRubens/ops
          ref: fix/compose-empty-dns-record
      - uses: actions/checkout@v4
        with:
          path: self
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: python3 self/ci/mutate_ops_dns.py ${{ matrix.name }}
