name: static-ip-unit
# Checks of the branches of AngeloRubens/ops for the fixed ip of ops compose (Actions are disabled
# on that fork, so they run here). Runs on a push whose head commit message contains [unit].
on:
  push:
    branches: [check/static-ip-run]
permissions:
  contents: read
jobs:
  unit:
    if: contains(github.event.head_commit.message, '[unit]')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        ref:
          - feat/compose-static-ip
          - check/static-ip-revert
          - check/static-ip-revert-restore
          - check/static-ip-wide-restore
          - 11835380d63576a0a7d3021cc176bf3cd4c60935
    steps:
      - uses: actions/checkout@v4
        with:
          repository: AngeloRubens/ops
          ref: ${{ matrix.ref }}
      - run: git log --oneline | head -2; git rev-parse HEAD
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        if: always()
        run: |
          unformatted=$(gofmt -l cmd/ network/ lepton/ provider/onprem/)
          if [ -n "$unformatted" ]; then echo "not gofmt'd: $unformatted"; gofmt -d cmd/; exit 1; fi
          echo "gofmt clean"
      - name: vet (the struct tag error at onprem_instance.go:764 exists on the base and is the only one allowed)
        if: always()
        run: |
          go vet ./cmd/... ./lepton/... ./types/... ./network/... ./provider/onprem/... > /tmp/vet.txt 2>&1 || true
          cat /tmp/vet.txt
          other=$(grep -v '^#' /tmp/vet.txt | grep -v 'onprem_instance.go:764:2: struct field tag' || true)
          if [ -n "$other" ]; then echo "UNEXPECTED vet output:"; echo "$other"; exit 1; fi
      - name: build
        if: always()
        run: go build -o /tmp/ops -v . && echo build ok
      - name: new tests (this step is red when a test fails)
        if: always()
        run: |
          set -o pipefail
          go test ./cmd/ -count 1 -v -run 'TestParseCompose|TestValidateComposeIPs|TestLoadPackageConfig|TestPackageIP' 2>&1 | tee /tmp/new.txt | grep -E '^--- (PASS|FAIL)|^(ok|FAIL|PASS)|build failed|\.go:[0-9]+:[0-9]+'
      - name: whole cmd module and changed packages (red on any failure except TestBuildImageFlagsMergeToConfig, which fails on the base)
        if: always()
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 qemu-utils iproute2 dnsmasq >/dev/null
          go test ./cmd/... ./network/... ./lepton/... ./provider/onprem/... -count 1 -v > /tmp/all.txt 2>&1 || true
          grep -E '^(--- FAIL|FAIL|ok|panic)' /tmp/all.txt
          echo "top-level PASS: $(grep -cE '^--- PASS' /tmp/all.txt)  FAIL: $(grep -cE '^--- FAIL' /tmp/all.txt)"
          bad=$(grep -E '^--- FAIL' /tmp/all.txt | grep -v 'TestBuildImageFlagsMergeToConfig' || true)
          pk=$(grep -E 'build failed|^panic' /tmp/all.txt || true)
          if [ -n "$bad$pk" ]; then echo "UNEXPECTED:"; echo "$bad"; echo "$pk"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-${{ strategy.job-index }}
          path: |
            /tmp/new.txt
            /tmp/all.txt
