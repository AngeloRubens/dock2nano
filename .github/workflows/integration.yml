name: integration

on:
  push:
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: docker version
        run: docker version
      - name: integration tests
        run: go test -tags integration -v -timeout 15m ./internal/docker ./internal/observe
