name: petclinic-docker
# Runs examples/petclinic-glassfish with plain docker compose and asks the pages that read the
# database: what the example does where it is meant to run, to compare with nanos. Manual only.
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compose:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[petclinic-docker]')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: up
        run: |
          cd examples/petclinic-glassfish
          docker compose up -d --build 2>&1 | tail -5
      - name: ask
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -m 5 -o /dev/null -w '%{http_code}' http://localhost:8080/home.jsf || true)
            echo "home.jsf $code"
            case "$code" in 2*|3*) break;; esac
            sleep 10
          done
          for u in home.jsf owner.jsf petType.jsf veterinarian.jsf; do
            echo "=== GET $u"
            curl -s -m 120 -o /tmp/$u.html -w '%{http_code}\n' "http://localhost:8080/$u" || true
            sed -e 's/<[^>]*>/ /g' /tmp/$u.html | tr -s ' \n' | head -c 800; echo
          done
      - name: logs
        if: always()
        run: |
          cd examples/petclinic-glassfish
          docker compose logs --no-color petclinic 2>&1 | grep -n "EclipseLink\|CREATE TABLE\|SEVERE\|doesn't exist" | cut -c1-250 | head -20
          docker compose logs --no-color db 2>&1 | tail -5 | cut -c1-200
          docker compose exec -T db mysql -uroot -prootpass -e 'show tables' petclinic 2>&1 | head -20
      - name: schema
        if: always()
        run: |
          cd examples/petclinic-glassfish
          docker compose exec -T db mysqldump -uroot -prootpass --no-data --no-tablespaces --skip-comments --skip-add-drop-table petclinic 2>/dev/null | sed -e 's/ AUTO_INCREMENT=[0-9]*//' -e '/^\/\*!/d' -e '/^$/d'
          docker compose exec -T db mysql -uroot -prootpass -e 'select count(*) as owners from owner; select count(*) as vets from vet' petclinic 2>/dev/null
      - name: down
        if: always()
        run: cd examples/petclinic-glassfish && docker compose down -v
