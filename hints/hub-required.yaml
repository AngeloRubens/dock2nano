# Programs for which the ops package hub (https://repo.ops.city) holds a
# special build that has to be used whole: its files, not the files of the
# image of the user. A row matches by the name of the image and the program
# that was observed, and a package of the hub is taken only if its namespace
# and name are listed.
#
# The row for postgres is active. It is proven by run 44887394014 of the
# branch check/hub-try on the fork: the hub packages eyberg/postgresql 11.3.0
# and francescolavra/postgres 16.2 both answered pg_isready with "accepting
# connections", 4 of 4, alone, with no app.
rows:
  - images: [postgres, postgresql]
    programs: [postgres]
    packages:
      - francescolavra/postgres
      - eyberg/postgresql
    reason: postgres starts a process per connection and needs SysV shared memory (shmget), which nanos does not have; the hub builds run it with threads
    entrypoint_note: >-
      POSTGRES_DB, POSTGRES_USER and POSTGRES_PASSWORD do not create the
      database, the user or the password; in a CI run (run 44908630495) the
      database "example" did not exist after the start, the backend of
      spring-postgres gave no answer and its console said database "example"
      does not exist, and with CREATE DATABASE sent over the network to the
      started package (psql, user postgres; user eyberg for
      eyberg/postgresql 11.3.0) the same backend answered 200. That step is
      not done by this tool: do it yourself after the start
