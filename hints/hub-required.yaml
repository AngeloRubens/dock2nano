# Programs for which the ops package hub (https://repo.ops.city) holds a
# special build that has to be used whole: its files, not the files of the
# image of the user. A row matches by the name of the image and the program
# that was observed, and a package of the hub is taken only if its namespace
# and name are listed.
#
# The row for postgres is active. It is proven by run 44887394014 of the
# branch check/hub-try on the fork: the hub packages eyberg/postgresql 11.3.0
# and francescolavra/postgres 16.2 both answered pg_isready with "accepting
# connections", 2 of 2 for each of the two packages, alone, with no app.
#
# The text of entrypoint_note can hold {NAME}, {NAME|default}, {A,B} (the first
# of A and B that is set), {NAME:ident} (a quoted identifier), {HUB_SUPERUSER}
# (from superusers) and {HUB_FACTS} (from package_facts); both must have an
# entry for every package of the row. [[if TEST]]...[[end]] and
# [[unless TEST]]...[[end]] do not nest; TEST is terms joined by " and ", each
# NAMES, NAMES!="text" or NAMES!=OTHER, with "not " before it. HUB_ENV_UNCERTAIN
# (the environment of the service could not be read completely) and HUB_CONTROL
# (a name holds control or format characters or is not UTF-8) are set by the
# tool, and so is HUB_TOOLONG (a quoted name is longer than 63 bytes).
# post_up_script is a shell script written with the same syntax, with
# {NAME:lit} (a SQL string literal), {NAME:sh} (a word of a shell) and
# {HUB_INSTANCE} (the name of the instance, the pkg name of compose.yaml)
# besides, and {{ and }} for literal braces. A brace of shell code that is not a
# placeholder must have a space or a line break after it (a function body); any
# other brace is written {{ or }}. No placeholder of the script may name a
# secret or have a fallback. It is written next to compose.yaml for the user to
# run after ops compose up, only if it holds a line that starts with "ensure '",
# and the row needs an entrypoint_note, which announces it. A variable whose
# name says PASS, PWD, SECRET, TOKEN or KEY is never written. The tool sets
# HUB_PW (a password is given), HUB_PWENV (POSTGRES_PASSWORD is set: the script
# reads it from the shell when it runs) and HUB_PWFILE (the path on this machine
# of the file of POSTGRES_PASSWORD_FILE: the script reads it when it runs); they
# say that there is a password, never its value. The text is
# checked when the table is read.
rows:
  - images: [postgres, postgresql]
    programs: [postgres]
    packages:
      - francescolavra/postgres
      - eyberg/postgresql
    superusers:
      francescolavra/postgres: postgres
      eyberg/postgresql: eyberg
    package_facts:
      francescolavra/postgres: >-
        In francescolavra/postgres 16.2 a database named postgres exists, so
        psql -U postgres without -d connects (run 44908630495 ran psql -U
        postgres without -d; CREATE DATABASE worked).
      eyberg/postgresql: >-
        In eyberg/postgresql 11.3.0 there is no database named eyberg, which
        psql uses by default for the user eyberg, so -d is needed (list of
        databases, run 44910340290).
    post_up_script: |
      #!/bin/sh
      # This is the post-up script written by the converter of your compose file, to
      # be run by you after "ops compose up": ops compose does not run it. Read it
      # before you run it.
      # It does NOT do all that the entrypoint of the postgres image does (the
      # files of /docker-entrypoint-initdb.d are not handled). It creates, each
      # one only if it is absent:
      [[if POSTGRES_USER!=HUB_SUPERUSER and not HUB_CONTROL and not HUB_TOOLONG]]#   - the role POSTGRES_USER, with LOGIN SUPERUSER
      [[end]][[if POSTGRES_DB,POSTGRES_USER!="postgres" and POSTGRES_USER!=HUB_SUPERUSER and not HUB_CONTROL and not HUB_TOOLONG]]#   - the database POSTGRES_DB (else POSTGRES_USER), owned by that role
      [[end]][[if POSTGRES_DB,POSTGRES_USER!="postgres" and not POSTGRES_USER!=HUB_SUPERUSER and not HUB_CONTROL and not HUB_TOOLONG]]#   - the database POSTGRES_DB (else POSTGRES_USER)
      [[end]][[if HUB_PW]]# and then sets the password of the role {POSTGRES_USER,HUB_SUPERUSER:sh}
      # (ALTER ROLE). The value is read when the script runs, is passed to psql
      # only through PGPASSWORD and standard input, and is never printed.
      [[end]]# It assumes: psql is installed on this machine, and the server accepts
      # the superuser {HUB_SUPERUSER:sh} without a password (the package of the hub
      # trusts every address; psql is run with -w: it fails instead of asking).
      # This script ignores ~/.pgpass and a PGPASSWORD of your shell.
      [[if HUB_PWENV]]# The password is the variable POSTGRES_PASSWORD of the shell that runs this
      # script. Export it first; sudo drops it unless you run the script with
      # sudo --preserve-env=POSTGRES_PASSWORD (and PGHOST, POSTUP_TRIES if you set them).
      [[end]][[if HUB_PWFILE]]# The password is read from the file {HUB_PWFILE:sh} when the script runs.
      [[end]]# The statement CREATE ROLE with OWNER was never run against the package in a
      # CI run; CREATE DATABASE and a password change were run (one run, no owner:
      # run 45405259016).
      [[if HUB_PW]]# Notes on the password: a trailing line break of the file is dropped, as the
      # entrypoint of the postgres image does for a file; a single quote is doubled
      # and a backslash is kept, which is right while standard_conforming_strings
      # is on (the default); printf is a builtin of the shell, so the password is
      # never an argument of a program.
      [[end]]# Usage: post-up-{HUB_INSTANCE}.sh [address of the database]
      # Without an address it uses PGHOST, then the PRIVATE IPS column of
      # ops instance list for the instance {HUB_INSTANCE}, and then the last
      # "assigned" address in the output of: ops instance logs {HUB_INSTANCE}
      # POSTUP_TRIES is the number of tries of a psql SELECT 1 as the superuser, 5
      # seconds apart, each with a connect timeout of 5 seconds (24 tries: 2 to 4
      # minutes in all). Under sudo, keep these variables with --preserve-env.
      set -eu

      PGPASSFILE=/dev/null
      export PGPASSFILE
      PGCONNECT_TIMEOUT=5
      export PGCONNECT_TIMEOUT

      instance={HUB_INSTANCE:sh}
      if [ "$#" -ge 1 ] && [ -n "$1" ]; then
        host=$1
      else
        host=${{PGHOST:-}}
      fi
      if [ -z "$host" ]; then
        if ! command -v ops >/dev/null 2>&1; then
          echo "no address: give it as the first argument or in PGHOST (ops is not installed here, so it cannot be read from ops instance logs)" >&2
          exit 1
        fi
        host=$(ops instance list 2>/dev/null | awk -F'|' -v n="$instance" '{ g = $3; gsub(/ /, "", g); if (g == n) { ip = $7; gsub(/ /, "", ip); print ip } }' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' | tail -n 1 || true)
        if [ -z "$host" ]; then
          host=$(ops instance logs "$instance" 2>/dev/null | grep -o 'assigned [0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*' | tail -n 1 | awk '{print $2}' || true)
        fi
      fi
      if [ -z "$host" ]; then
        echo "no address: ops instance list and the console of $instance give none (is it up? ops needs the same OPS_HOME and user as for ops compose up); give the address as the first argument or in PGHOST" >&2
        exit 1
      fi
      if ! command -v psql >/dev/null 2>&1; then
        echo "psql is not installed on this machine: install the client of postgres (apt install postgresql-client, dnf install postgresql, brew install libpq, apk add postgresql-client) and run this again" >&2
        exit 1
      fi
      tries=${{POSTUP_TRIES:-24}}
      case "$tries" in
        ''|*[!0-9]*|0) tries=24 ;;
      esac

      [[if HUB_PW]]pw=
      [[end]][[if HUB_PWENV]]pw=${{POSTGRES_PASSWORD:-}}
      [[end]][[if HUB_PWFILE]]if [ -z "$pw" ]; then
        pwfile={HUB_PWFILE:sh}
        if [ ! -r "$pwfile" ]; then
          echo "the file of the password cannot be read: $pwfile" >&2
          exit 1
        fi
        pw=$(cat "$pwfile")
      fi
      [[end]][[if HUB_PW]]if [ -n "$pw" ]; then
        PGPASSWORD=$pw
        export PGPASSWORD
      fi
      [[end]]
      psql_su() {
        psql -X -h "$host" -U {HUB_SUPERUSER:sh} -d template1 -w -tA -v ON_ERROR_STOP=1 "$@"
      }

      echo "waiting for the database at $host"
      i=0
      ready=0
      while [ "$i" -lt "$tries" ]; do
        if psql_su -c 'SELECT 1' >/dev/null 2>&1; then
          ready=1
          break
        fi
        i=$((i + 1))
        echo "no answer yet ($i of $tries)" >&2
        if [ "$i" -lt "$tries" ]; then
          sleep 5
        fi
      done
      if [ "$ready" != 1 ]; then
        echo "the database at $host did not answer after $tries tries, 5 seconds apart; last answer:" >&2
        psql_su -c 'SELECT 1' 2>&1 | tail -n 3 >&2 || true
        exit 1
      fi

      # ensure WHAT CHECK CREATE: runs CREATE only when CHECK finds nothing; when
      # CREATE fails it looks again, and an object that is there now is a success
      ensure() {
        found=$(psql_su -c "$2") || { echo "failed: could not look for the $1" >&2; exit 1; }
        if [ "$found" = 1 ]; then
          echo "the $1 exists already, nothing done"
          return 0
        fi
        if psql_su -c "$3" >/dev/null; then
          echo "created the $1"
          return 0
        fi
        found=$(psql_su -c "$2" 2>/dev/null) || found=
        if [ "$found" = 1 ]; then
          echo "the $1 exists now, nothing more to do"
          return 0
        fi
        echo "failed: could not create the $1" >&2
        exit 1
      }

      [[if POSTGRES_USER!=HUB_SUPERUSER and not HUB_CONTROL and not HUB_TOOLONG]]ensure 'role' 'SELECT 1 FROM pg_roles WHERE rolname = {POSTGRES_USER:lit}' 'CREATE ROLE {POSTGRES_USER:ident} LOGIN SUPERUSER'
      [[end]][[if POSTGRES_DB,POSTGRES_USER!="postgres" and POSTGRES_USER!=HUB_SUPERUSER and not HUB_CONTROL and not HUB_TOOLONG]]ensure 'database' 'SELECT 1 FROM pg_database WHERE datname = {POSTGRES_DB,POSTGRES_USER:lit}' 'CREATE DATABASE {POSTGRES_DB,POSTGRES_USER:ident} OWNER {POSTGRES_USER:ident}'
      [[end]][[if POSTGRES_DB,POSTGRES_USER!="postgres" and not POSTGRES_USER!=HUB_SUPERUSER and not HUB_CONTROL and not HUB_TOOLONG]]ensure 'database' 'SELECT 1 FROM pg_database WHERE datname = {POSTGRES_DB,POSTGRES_USER:lit}' 'CREATE DATABASE {POSTGRES_DB,POSTGRES_USER:ident}'
      [[end]]
      [[if HUB_PW]]# the statement goes to psql on standard input, never as an argument; the
      # errors of psql are not shown, as they can quote the statement
      if [ -n "$pw" ]; then
        esc=$(printf '%s' "$pw" | sed "s/'/''/g")
        {{ printf '%s' 'ALTER ROLE {POSTGRES_USER,HUB_SUPERUSER:ident} PASSWORD '; printf "'%s';\n" "$esc"; }} | psql_su >/dev/null 2>&1 || {{ echo "failed: could not set the password of the role" >&2; exit 1; }}
        echo "set the password of the role"
      else
        echo "no password is set: the password was not found (the variable of the compose file is empty in this shell, or the file is empty)"
      fi
      [[end]]echo "done"
    reason: postgres starts a process per connection and nanos runs one process; the hub builds run it with threads
    restart_note: >-
      A restart of the same disk was seen failing: after an unclean stop (the
      first boot ended by SIGTERM to qemu) the second boot did not start
      postgres (FATAL, pre-existing shared memory block is still in use; run
      44910340290). A restart after a crash of the program is not measured
    entrypoint_note: >-
      POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_PASSWORD_FILE,
      POSTGRES_INITDB_ARGS and the files of /docker-entrypoint-initdb.d are
      ignored: no database, user, password or script. Run 44908630495
      (francescolavra/postgres 16.2): the database "example" did not exist
      after the start, the backend of spring-postgres gave no answer (console:
      database "example" does not exist); after a CREATE DATABASE over the
      network it answered 200. Connect as the superuser, here {HUB_SUPERUSER},
      with -d to an existing database (postgres and template1 exist in both
      packages, run 44910340290).
      [[if HUB_CONTROL]]The name of the database or of the role holds a
      control character (a line break, a tab or another one): no command is
      printed for it, quote the name by hand.[[end]]
      [[if POSTGRES_USER!=HUB_SUPERUSER and not HUB_CONTROL]]The role
      {POSTGRES_USER:ident} is not created either. In the image POSTGRES_USER
      is the superuser; to make it so, run by hand: psql -h <address of the
      db> -U {HUB_SUPERUSER} -d template1 -c 'CREATE ROLE
      {POSTGRES_USER:ident} LOGIN SUPERUSER'. This command and the CREATE
      DATABASE with OWNER below were NOT run in any CI run (no cited run
      executes CREATE ROLE): do not take them to work.[[end]]
      [[if POSTGRES_DB,POSTGRES_USER!="postgres" and POSTGRES_USER!=HUB_SUPERUSER and not HUB_CONTROL]]To create
      the database, owned by that role as in the image, run by hand after the
      role: psql -h <address of the db> -U {HUB_SUPERUSER} -d template1 -c
      'CREATE DATABASE {POSTGRES_DB,POSTGRES_USER:ident} OWNER
      {POSTGRES_USER:ident}'.[[end]]
      [[if POSTGRES_DB,POSTGRES_USER!="postgres" and not POSTGRES_USER!=HUB_SUPERUSER and not HUB_CONTROL]]To create
      the database, run it by hand: psql -h <address of the db> -U
      {HUB_SUPERUSER} -d template1 -c 'CREATE DATABASE
      {POSTGRES_DB,POSTGRES_USER:ident}'.[[end]]
      [[if not HUB_ENV_UNCERTAIN and not POSTGRES_DB,POSTGRES_USER!="postgres"]]No database has to be
      created: with neither POSTGRES_DB nor POSTGRES_USER set (or set to
      postgres) the entrypoint would use the database postgres, which exists
      in the package.[[end]]
      [[if HUB_ENV_UNCERTAIN]]The environment of this service could not be
      read completely (see the other items of the service), so the names of
      POSTGRES_DB and POSTGRES_USER may differ from the ones shown.[[end]]
      [[if HUB_ENV_UNCERTAIN and not POSTGRES_DB,POSTGRES_USER and not HUB_CONTROL]]POSTGRES_DB and
      POSTGRES_USER are not known here. If POSTGRES_DB is set (else
      POSTGRES_USER), create the database it names: psql -h <address of the
      db> -U {HUB_SUPERUSER} -d template1 -c 'CREATE DATABASE
      {POSTGRES_DB,POSTGRES_USER:ident}'; with neither set the entrypoint
      would use the database postgres, which exists in the package.[[end]]
      This tool does not run these commands; the end of this item says whether
      it wrote a script for them.
      {HUB_FACTS} The superuser of eyberg/postgresql 11.3.0 is eyberg, the role
      postgres does not exist there (run 44909583390).
      The database has to exist before the application connects: in run
      44908630495 the backend connected about 43 s after CREATE DATABASE
      (run 45395987354: about 50 s after the start of the instances)
      (13:29:34.95; HikariPool-1 starting at 13:30:17.893) and ops compose up
      starts all instances together, so a sooner connection fails unless the
      application retries.
      A second boot of the same disk after an unclean stop did not start
      postgres: FATAL, pre-existing shared memory block (key 5432001 for
      eyberg/postgresql 11.3.0, key 896 for francescolavra/postgres 16.2) is
      still in use (run 44910340290, boot 2); it comes from the postmaster.pid
      left by the first boot, the file itself was not seen. Data kept across a
      restart was not measured, nor the database after ops compose builds the
      image again at each up.
